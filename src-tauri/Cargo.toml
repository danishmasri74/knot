[package]
name = "knot"
version = "0.6.3"
edition = "2021"

[lib]
name = "knot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
tempfile = "3"
same-file = "1.0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["sync", "macros", "time", "net"] }
futures-util = "0.3"
encoding_rs = "0.8"
flate2 = "1"
brotli = "8"
httpdate = "1"
base64 = "0.22"
webbrowser = "1"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Power", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_WinRT", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation", "Foundation_Collections", "Data_Pdf"] }

# Build-time code only (not the shipped app). Tauri Brotli-compresses the
# ~200 MB frontend inside its macro; unoptimized, that took ~6 extra minutes
# whenever the cache was cold (every version change gets a new build folder).
[profile.release.build-override]
opt-level = 3
